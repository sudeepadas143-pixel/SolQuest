<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>SolQuest</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b0d17; overflow: hidden; overscroll-behavior: none; }
      /* phones: no double-tap zoom, no long-press magnifier / selection / callout */
      html, body, #game, #game canvas, #touchpad, #touchpad * {
        touch-action: none; -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      .er-input { touch-action: manipulation; -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
      #game { position: fixed; inset: 0; }
      #game canvas { image-rendering: pixelated; }
      .er-input {
        font-family: "Pixelify Sans", monospace; font-size: 30px; color: #fff;
        background: #000; border: 3px solid #fbf6e9; border-radius: 12px;
        outline: 2px solid #6fd3c1; outline-offset: 3px;
        padding: 10px 16px; box-sizing: border-box; text-align: center;
      }
      .er-input:focus { border-color: #14f195; }
      #touchpad { display: none; position: fixed; inset: auto 0 0 0; height: 0; z-index: 10; user-select: none; -webkit-user-select: none; touch-action: none; }
      #touchpad .btn { position: fixed; width: 58px; height: 58px; border-radius: 14px; background: rgba(251,246,233,.18);
        border: 2px solid rgba(251,246,233,.55); color: #fbf6e9; font: 22px monospace; display: flex; align-items: center; justify-content: center; }
      #touchpad .btn.on { background: rgba(111,211,193,.5); }
      #touchpad [data-act=up] { left: 78px; bottom: 150px; }
      #touchpad [data-act=down] { left: 78px; bottom: 26px; }
      #touchpad [data-act=left] { left: 16px; bottom: 88px; }
      #touchpad [data-act=right] { left: 140px; bottom: 88px; }
      #touchpad [data-act=confirm] { right: 24px; bottom: 96px; border-radius: 50%; width: 66px; height: 66px; }
      #touchpad [data-act=cancel] { right: 104px; bottom: 40px; border-radius: 50%; }
      #touchpad .btn small { position: absolute; bottom: -18px; font-size: 10px; opacity: .7; }
      #touchpad [data-act=menu] { right: 24px; bottom: 16px; width: 66px; height: 36px; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="touchpad">
      <div class="btn" data-act="up">▲</div>
      <div class="btn" data-act="down">▼</div>
      <div class="btn" data-act="left">◀</div>
      <div class="btn" data-act="right">▶</div>
      <div class="btn" data-act="confirm">A</div>
      <div class="btn" data-act="cancel">B<small>RUN</small></div>
      <div class="btn" data-act="menu">MENU</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
