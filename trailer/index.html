<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SolQuest Trailer Preview</title>
  <style>
    :root { --bg: #07060d; --panel: #141228; --ink: #fff7e6; --muted: #9a93c0; --mint: #2ef2a8; --gold: #ffc94a; --coral: #ff6b7a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
    #frame { position: relative; aspect-ratio: 16 / 9; width: min(100%, calc((100vh - 120px) * 16 / 9)); background: #000; }
    #c { width: 100%; height: 100%; display: block; }
    #tc { position: absolute; left: 12px; top: 10px; font: 600 13px/1.5 ui-monospace, monospace; background: rgba(0,0,0,.72); padding: 6px 10px; border-radius: 6px; white-space: pre; pointer-events: none; }
    #tc[hidden] { display: none; }
    #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--muted); pointer-events: none; }
    #bar { display: flex; gap: 10px; align-items: center; padding: 10px 16px 16px; flex-wrap: wrap; }
    button { background: var(--panel); color: var(--ink); border: 1px solid #2b2750; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { border-color: var(--mint); }
    button.rec { color: var(--coral); }
    button.rec.on { background: var(--coral); color: #000; }
    #scrub { flex: 1; min-width: 160px; accent-color: var(--mint); }
    #time { font: 600 13px ui-monospace, monospace; color: var(--muted); min-width: 80px; text-align: right; }
    .keys { color: var(--muted); font-size: 12px; width: 100%; }
    kbd { border: 1px solid #2b2750; border-radius: 4px; padding: 0 5px; font: 11px ui-monospace, monospace; }
  </style>
</head>
<body>
  <div id="stage">
    <div id="frame">
      <canvas id="c" width="1920" height="1080"></canvas>
      <div id="tc" hidden></div>
      <div id="status">loading ...</div>
    </div>
  </div>
  <div id="bar">
    <button id="play">play</button>
    <button id="replay">replay</button>
    <input id="scrub" type="range" min="0" max="899" step="1" value="0" />
    <span id="time">00:00:00</span>
    <button id="tcBtn">timecode</button>
    <button id="rec" class="rec">record</button>
    <div class="keys"><kbd>space</kbd> play / pause · <kbd>R</kbd> replay · <kbd>T</kbd> timecode · <kbd>←</kbd><kbd>→</kbd> one frame. The master is <code>solquest-trailer.mp4</code> (rendered frame by frame); <b>record</b> is a realtime fallback that saves a .webm.</div>
  </div>
  <script type="module" src="/src/preview.js"></script>
</body>
</html>
