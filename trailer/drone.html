<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SolQuest Drone Flight</title>
  <style>html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; image-rendering: pixelated; }</style>
</head>
<body>
  <canvas id="c" width="320" height="214" style="width:960px;height:642px"></canvas>
  <script type="module">
    import { Drone, LOOP } from '/src/drone/main.js';
    const d = new Drone(document.getElementById('c'));
    window.__drone = { LOOP, ready: d.init(), renderAt: (t) => d.renderAt(t), obj: d,
      frame: (t) => { d.renderAt(t); return document.getElementById('c').toDataURL('image/png'); } };
    // live preview when opened in a browser: ?play
    if (new URLSearchParams(location.search).has('play')) {
      window.__drone.ready.then(() => { const t0 = performance.now(); const f = () => { d.renderAt((performance.now() - t0) / 1000); requestAnimationFrame(f); }; f(); });
    }
  </script>
</body>
</html>
